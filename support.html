<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Support</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #000;

        font-family: Arial, Helvetica, sans-serif;
    }


    /* ==================================================
       HINTERGRUND
       ================================================== */

    .page {
        position: relative;

        width: 100vw;
        height: 100vh;

        background-image: url("Bilder/support.png");

        background-position: center;
        background-repeat: no-repeat;

        background-size: contain;

        background-color: #000;
    }


    /* ==================================================
       CHATBOX
       ================================================== */

    .chat-box {

        position: absolute;

        top: 18%;
        right: 7%;

        width: 40%;
        height: 67%;

        min-width: 300px;
        min-height: 350px;

        display: flex;
        flex-direction: column;

        background: rgba(59, 59, 63, 0.690);

        border: 1px solid rgba(255, 255, 255, 0);

        border-radius: 28px;

        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.06);

        overflow: hidden;
    }


    /* ==================================================
       CHAT HEADER
       ================================================== */

    .chat-header {

        display: flex;
        align-items: center;

        padding: 16px 20px;

        min-height: 70px;

        background: rgba(25, 21, 21, 0.22);

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }


    .bot-avatar {

        width: 42px;
        height: 42px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin-right: 12px;

        border-radius: 50%;

        background: linear-gradient(
            135deg,
            #ffffff,
            #bcbcbc
        );

        color: #111;

        font-size: 21px;

        box-shadow:
            0 4px 15px rgba(0, 0, 0, 0.3);
    }


    .header-text {
        color: white;
    }


    .header-title {

        font-size: 17px;

        font-weight: bold;

        letter-spacing: 0.3px;
    }


    .header-status {

        margin-top: 4px;

        font-size: 12px;

        color: #78e08f;
    }


    /* ==================================================
       NACHRICHTEN
       ================================================== */

    .messages {

        flex: 1;

        min-height: 0;

        padding: 18px;

        overflow-y: auto;

        scrollbar-width: thin;

        scrollbar-color: #555 transparent;
    }


    .messages::-webkit-scrollbar {
        width: 5px;
    }


    .messages::-webkit-scrollbar-thumb {

        background: #555;

        border-radius: 10px;
    }


    /* ==================================================
       CHAT BUBBLES
       ================================================== */

    .message {

        width: fit-content;

        max-width: 78%;

        margin-bottom: 12px;

        padding: 11px 14px;

        border-radius: 16px;

        font-size: 14px;

        line-height: 1.45;

        word-wrap: break-word;

        animation: appear 0.2s ease;
    }


    @keyframes appear {

        from {
            opacity: 0;
            transform: translateY(5px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }


    /* Bot */

    .bot {

        margin-right: auto;

        color: #fff;

        background: rgba(255, 255, 255, 0.10);

        border: 1px solid rgba(255, 255, 255, 0.06);

        border-bottom-left-radius: 4px;
    }


    /* Benutzer */

    .user {

        margin-left: auto;

        color: #111;

        background: #ffffff;

        border-bottom-right-radius: 4px;

        box-shadow:
            0 3px 10px rgba(0, 0, 0, 0.2);
    }


    /* ==================================================
       SCHREIB-ANIMATION
       ================================================== */

    .typing {

        display: none;

        width: fit-content;

        margin-bottom: 12px;

        padding: 10px 14px;

        color: #aaa;

        background: rgba(255, 255, 255, 0.08);

        border-radius: 16px;

        border-bottom-left-radius: 4px;

        font-size: 13px;
    }


    .dots span {

        display: inline-block;

        animation: blink 1.2s infinite;
    }


    .dots span:nth-child(2) {
        animation-delay: 0.2s;
    }


    .dots span:nth-child(3) {
        animation-delay: 0.4s;
    }


    @keyframes blink {

        0%, 60%, 100% {
            opacity: 0.25;
        }

        30% {
            opacity: 1;
        }
    }


    /* ==================================================
       EINGABEBEREICH
       ================================================== */

    .input-area {

        display: flex;

        gap: 8px;

        padding: 12px;

        background: rgba(0, 0, 0, 0.25);

        border-top: 1px solid rgba(255, 255, 255, 0.08);
    }


    #input {

        flex: 1;

        min-width: 0;

        height: 44px;

        padding: 0 15px;

        outline: none;

        border: 1px solid rgba(255, 255, 255, 0.12);

        border-radius: 13px;

        background: rgba(255, 255, 255, 0.08);

        color: white;

        font-size: 14px;
    }


    #input::placeholder {
        color: #999;
    }


    #input:focus {

        border-color: rgba(255, 255, 255, 0.3);

        background: rgba(255, 255, 255, 0.11);
    }


    #send {

        width: 45px;
        height: 44px;

        flex-shrink: 0;

        border: none;

        border-radius: 13px;

        background: white;

        color: #111;

        font-size: 18px;

        cursor: pointer;

        transition: 0.15s;
    }


    #send:hover {

        transform: scale(1.04);

        background: #e8e8e8;
    }


    #send:active {

        transform: scale(0.96);
    }


    /* ==================================================
       HANDY
       ================================================== */

    @media (max-width: 800px) {

        .chat-box {

            top: 10%;
            right: 5%;

            width: 90%;
            height: 80%;

            min-width: 0;
        }
    }


</style>

/* ==========================================================
   ANTWORT SUCHEN
   ========================================================== */


function getBotAnswer(text) {

    const nachricht =
        text.toLowerCase().trim();


    /*
       Alle Antwortgruppen durchsuchen.

       Sobald EIN Wort passt, wird diese
       Antwort verwendet.
    */

    for (const gruppe of antworten) {

        const gefunden =
            gruppe.woerter.some(
                wort =>
                    nachricht.includes(
                        wort.toLowerCase()
                    )
            );


        if (gefunden) {

            return gruppe.antwort;

        }

    }


    /*
       Keine Übereinstimmung:
       zufällige Standardantwort.
    */


    const zufall =
        Math.floor(
            Math.random()
            *
            standardAntworten.length
        );


    return standardAntworten[zufall];

}



/* ==========================================================
   NACHRICHT HINZUFÜGEN
   ========================================================== */


function addMessage(text, type) {

    const messages =
        document.getElementById("messages");


    const message =
        document.createElement("div");


    message.className =
        "message " + type;


    /*
       textContent verhindert,
       dass HTML aus Benutzereingaben
       ausgeführt wird.
    */


    message.textContent =
        text;


    const typing =
        document.getElementById("typing");


    messages.insertBefore(
        message,
        typing
    );


    messages.scrollTop =
        messages.scrollHeight;

}



/* ==========================================================
   MEHRERE BOT-NACHRICHTEN
   ========================================================== */


function showBotMessages(antwort) {


    /*
       NORMALE ANTWORT

       Beispiel:

       antwort:
           "Hallo!"
    */


    if (!Array.isArray(antwort)) {

        addMessage(
            antwort,
            "bot"
        );

        return;

    }


    /*
       MEHRERE ANTWORTEN

       Beispiel:

       antwort: [
           "Hallo!",
           "Wie geht es dir?",
           "^^"
       ]

       Jede Nachricht erscheint
       separat mit 1,2 Sekunden Abstand.
    */


    antwort.forEach(
        function(nachricht, index) {


            setTimeout(
                function() {

                    addMessage(
                        nachricht,
                        "bot"
                    );

                },

                index * 1200

            );

        }
    );

}

   ========================================================== */


function sendMessage() {


    const input =
        document.getElementById("input");


    const text =
        input.value.trim();


    /*
       Leere Nachrichten ignorieren.
    */

    if (!text) {

        return;

    }


    /*
       Benutzer-Nachricht anzeigen.
    */

    addMessage(
        text,
        "user"
    );


    /*
       Eingabefeld leeren.
    */

    input.value = "";


    /*
       "Bohnsai schreibt..."
       anzeigen.
    */

    const typing =
        document.getElementById("typing");


    typing.style.display =
        "block";


    const messages =
        document.getElementById("messages");


    messages.scrollTop =
        messages.scrollHeight;


    /*
       Nach 700 ms antworten.
    */

    setTimeout(
        function() {


            typing.style.display =
                "none";


            /*
               Antwort suchen.
            */

            const antwort =
                getBotAnswer(text);


            /*
               Antwort anzeigen.
            */

            showBotMessages(
                antwort
            );


        },

        700

    );

}



/* ==========================================================
   ENTER-TASTE
   ========================================================== */


document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function(event) {


            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


</script>
