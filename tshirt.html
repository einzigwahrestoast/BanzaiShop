<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-Shirt Chuck</title>
  <link rel="icon" type="image/png" href="Bilder/Icon.png">

  <style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  .container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .container img {
    position: absolute;
    top: 50%;
    left: 50%;

    width: 100%;
    height: 100%;

    object-fit: contain;

    transform: translate(-50%, -50%);
  }

  .zone {
    position: absolute;
    cursor: pointer;
    
  }
</style>
</head>

<body>

<div class="container">

  <div class="image-wrapper">

    
    <img src="Bilder/Tshirt.png">

    
    <a href="index.html" class="zone"
       style="top:1%; left:10%; width:30%; height:5%;">
    </a>

  </div>

</div>

</body>
</html>
